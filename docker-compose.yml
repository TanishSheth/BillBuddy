# BillBuddy — Postgres + app.
# HTTP only (default):  docker compose up -d
# HTTPS: set DOMAIN + APP_HOST_PORT in .env, then:
#   sudo docker compose --profile https up -d
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-80}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: postgresql://billbuddy:${POSTGRES_PASSWORD}@db:5432/billbuddy
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      RUN_SCHEDULER: "1"
      RUN_OCR_POLLER: "0"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
    volumes:
      - billbuddy-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scan-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.scan_worker_main"]
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: postgresql://billbuddy:${POSTGRES_PASSWORD}@db:5432/billbuddy
      REDIS_URL: redis://redis:6379/0
      RUN_OCR_POLLER: "1"
      OCR_WORKER_CONCURRENCY: "${OCR_WORKER_CONCURRENCY:-2}"
    volumes:
      - billbuddy-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: billbuddy
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billbuddy -d billbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  billbuddy-data:
  pg-data:
  caddy-data:
  caddy-config:
