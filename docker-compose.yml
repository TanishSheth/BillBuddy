# Production stack for AWS Lightsail / EC2 — app + Postgres on port 80
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: postgresql://billbuddy:${POSTGRES_PASSWORD}@db:5432/billbuddy
      PORT: "8000"
    volumes:
      - billbuddy-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: billbuddy
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billbuddy -d billbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  billbuddy-data:
  pg-data:
