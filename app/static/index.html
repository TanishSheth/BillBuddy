<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>BillBuddy &mdash; My Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="bb-bg text-ink min-h-screen">

  <header class="page-header border-b-2 border-ink/10 sticky top-0 z-30 bb-bg/95 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 sm:px-5 py-3 sm:py-4 flex items-center justify-between gap-2 sm:gap-3">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="stamp-mark">$</div>
        <div class="min-w-0">
          <h1 class="page-title font-mono font-bold text-lg tracking-tight leading-none">BillBuddy</h1>
          <p class="text-[11px] uppercase tracking-widest text-ink/50 leading-none mt-1">My Groups</p>
        </div>
      </div>
      <div class="header-actions flex items-center gap-1.5 sm:gap-2 shrink-0">
        <span id="userGreeting" class="hidden md:inline font-mono text-xs text-ink/50 max-w-[120px] truncate"></span>
        <button id="newGroupBtn" type="button" class="bb-btn-primary !py-2 !px-3 text-[11px]">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span class="btn-label">New Group</span>
        </button>
        <button id="settingsBtn" type="button" class="bb-btn-secondary !py-2 !px-2 text-[10px]" title="Settings">
          <i data-lucide="settings" class="w-3 h-3"></i>
        </button>
        <button id="logoutBtn" type="button" class="bb-btn-secondary !py-1 !px-2 text-[10px]" title="Sign out">
          <i data-lucide="log-out" class="w-3 h-3"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main max-w-5xl mx-auto px-4 sm:px-5 py-6 sm:py-8">
    <div id="groupsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="emptyGroups" class="hidden bb-card max-w-md mx-auto text-center py-10">
      <i data-lucide="users" class="w-10 h-10 mx-auto mb-3 text-ink/30"></i>
      <h2 class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-2">No groups yet</h2>
      <p class="text-sm text-ink/60 mb-4">Create a group for household or trip expenses, or join one with an invite link.</p>
      <button id="createFirstGroupBtn" class="bb-btn-primary">
        <i data-lucide="plus" class="w-4 h-4"></i> Create a Group
      </button>
    </div>
  </main>

  <div id="createGroupModal" class="modal-overlay hidden">
    <div class="bb-card modal-card">
      <h2 class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-4">Create a Group</h2>
      <form id="createGroupForm" class="space-y-4">
        <div>
          <label class="bb-label">Group name</label>
          <input id="createGroupName" class="bb-input" placeholder="e.g. House Expenses" required autofocus />
        </div>
        <p id="createGroupMsg" class="text-xs font-mono"></p>
        <div class="flex gap-2 justify-end">
          <button type="button" id="cancelCreateGroupBtn" class="bb-btn-secondary">Cancel</button>
          <button type="submit" class="bb-btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/dashboard.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
