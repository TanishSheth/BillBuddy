<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>BillBuddy — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="bb-bg text-ink min-h-screen">

  <header class="page-header border-b-2 border-ink/10 sticky top-0 z-30 bb-bg/95 backdrop-blur">
    <div class="max-w-3xl mx-auto px-4 sm:px-5 py-3 sm:py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a href="/" id="backLink" class="bb-btn-secondary !py-2 !px-2 text-[10px] shrink-0" title="Back">
          <i data-lucide="arrow-left" class="w-3 h-3"></i>
        </a>
        <div class="min-w-0">
          <h1 class="font-mono font-bold text-lg tracking-tight leading-none">Settings</h1>
          <p class="text-[11px] uppercase tracking-widest text-ink/50 leading-none mt-1">Preferences</p>
        </div>
      </div>
    </div>
    <nav class="max-w-3xl mx-auto px-4 sm:px-5 pb-2">
      <div class="tab-nav flex gap-1 overflow-x-auto pb-1">
        <button type="button" data-settings-tab="general" class="tab-btn active">General</button>
        <button type="button" data-settings-tab="group" class="tab-btn">Group Settings</button>
      </div>
    </nav>
  </header>

  <main class="page-main max-w-3xl mx-auto px-4 sm:px-5 py-6 sm:py-8 space-y-6">

    <!-- General settings -->
    <section id="tab-general" class="settings-panel space-y-4">
      <div class="bb-card space-y-5">
        <div>
          <h2 class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-1">Receipt scanning (VLM)</h2>
          <p class="text-xs text-ink/50">Your API key is only used to read receipt images and auto-fill the form. You review and submit the expense yourself. Keys are stored encrypted on the server.</p>
        </div>

        <label class="settings-toggle">
          <span>
            <span class="settings-toggle-label">Use my own API key</span>
            <span class="settings-toggle-hint">When off, the server default key is used (if configured)</span>
          </span>
          <input type="checkbox" id="useOwnVlm" />
          <span class="settings-switch"></span>
        </label>

        <div id="generalVlmFields" class="space-y-4">
          <div>
            <label class="bb-label">Provider</label>
            <select id="generalProvider" class="bb-input"></select>
          </div>
          <div>
            <label class="bb-label">Model</label>
            <select id="generalModel" class="bb-input"></select>
          </div>
          <div>
            <label class="bb-label">API key</label>
            <input id="generalApiKey" type="password" class="bb-input" placeholder="Paste your API key" autocomplete="off" />
            <p id="generalKeyStatus" class="text-[10px] text-ink/40 mt-1 font-mono"></p>
          </div>
        </div>
      </div>

      <div class="bb-card space-y-4">
        <h2 class="font-mono uppercase text-xs tracking-widest text-ink/50">Notifications & display</h2>

        <label class="settings-toggle">
          <span>
            <span class="settings-toggle-label">Email monthly reports</span>
            <span class="settings-toggle-hint">Receive the PDF report by email at month-end</span>
          </span>
          <input type="checkbox" id="emailMonthlyReports" />
          <span class="settings-switch"></span>
        </label>

        <label class="settings-toggle">
          <span>
            <span class="settings-toggle-label">Compact list view</span>
            <span class="settings-toggle-hint">Denser layout on the expenses tab</span>
          </span>
          <input type="checkbox" id="compactListView" />
          <span class="settings-switch"></span>
        </label>
      </div>

      <div class="flex gap-2 justify-end">
        <button type="button" id="clearGeneralKeyBtn" class="bb-btn-secondary text-[11px]">Clear API key</button>
        <button type="button" id="saveGeneralBtn" class="bb-btn-primary text-[11px]">Save general settings</button>
      </div>
      <p id="generalMsg" class="text-xs font-mono"></p>
    </section>

    <!-- Group settings -->
    <section id="tab-group" class="settings-panel hidden space-y-4">
      <div class="bb-card space-y-4">
        <div>
          <label class="bb-label">Group</label>
          <select id="groupSelect" class="bb-input"></select>
          <p class="text-[10px] text-ink/40 mt-1 font-mono">Settings below apply only to you in the selected group.</p>
        </div>

        <label class="settings-toggle">
          <span>
            <span class="settings-toggle-label">Override global VLM settings</span>
            <span class="settings-toggle-hint">Use a different provider, model, or API key for this group</span>
          </span>
          <input type="checkbox" id="overrideGlobalVlm" />
          <span class="settings-switch"></span>
        </label>

        <div id="groupVlmFields" class="space-y-4 hidden">
          <div>
            <label class="bb-label">Provider</label>
            <select id="groupProvider" class="bb-input"></select>
          </div>
          <div>
            <label class="bb-label">Model</label>
            <select id="groupModel" class="bb-input"></select>
          </div>
          <div>
            <label class="bb-label">API key</label>
            <input id="groupApiKey" type="password" class="bb-input" placeholder="Paste your API key" autocomplete="off" />
            <p id="groupKeyStatus" class="text-[10px] text-ink/40 mt-1 font-mono"></p>
          </div>
        </div>

        <label class="settings-toggle">
          <span>
            <span class="settings-toggle-label">Select all members for split by default</span>
            <span class="settings-toggle-hint">When adding an expense, everyone starts selected</span>
          </span>
          <input type="checkbox" id="equalSplitDefault" />
          <span class="settings-switch"></span>
        </label>
      </div>

      <div class="flex gap-2 justify-end">
        <button type="button" id="clearGroupKeyBtn" class="bb-btn-secondary text-[11px]">Clear API key</button>
        <button type="button" id="saveGroupBtn" class="bb-btn-primary text-[11px]">Save group settings</button>
      </div>
      <p id="groupMsg" class="text-xs font-mono"></p>
    </section>

  </main>

  <script src="/settings.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
