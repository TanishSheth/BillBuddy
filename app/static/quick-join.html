<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShareSquad — View Split</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/styles.css?v=20260918h"></head><body class="bb-bg text-ink min-h-screen flex items-center justify-center px-5"><div class="auth-card bb-card text-center"><h1 class="font-mono font-bold text-lg text-brand">Quick Split</h1><p id="msg" class="text-sm text-ink/60 mt-3">Opening your shared bill…</p><a href="/login.html" class="bb-btn-secondary mt-4">Sign in or create an account</a></div><script src="/api.js?v=20260918h"></script><script>const code=new URLSearchParams(location.search).get('code');const msg=document.getElementById('msg');if(!code){msg.textContent='No quick split link was found.';}else{localStorage.setItem('sharesquad_pending_quick_split',code);if(ShareSquad.getToken()){ShareSquad.api('/quick-splits/join',{method:'POST',body:JSON.stringify({invite_code:code})}).then(s=>{localStorage.removeItem('sharesquad_pending_quick_split');location.href='/quick-split.html?id='+s.id;}).catch(e=>msg.textContent=e.message);}else{msg.textContent='Sign in or create an account to view this split.';}}</script></body></html>
