<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#F6F3EC">
<title>ShareSquad — Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><link rel="stylesheet" href="/styles.css?v=20260918g">
</head><body class="bb-bg text-ink min-h-screen">
<header class="page-header border-b-2 border-ink/10"><div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><a href="/" class="flex items-center gap-2"><img src="/logo.png" alt="ShareSquad" class="app-logo" onerror="this.style.display='none'"><span class="font-mono font-bold text-brand">ShareSquad</span></a><nav class="site-nav flex items-center bg-ink/5 p-1 rounded-lg"><a href="/" class="nav-tab"><i data-lucide="users" class="w-3.5 h-3.5"></i><span>Shared Groups</span></a><a href="/personal.html" class="nav-tab"><i data-lucide="wallet" class="w-3.5 h-3.5"></i><span>Personal</span></a><a href="/friends.html" class="nav-tab active"><i data-lucide="handshake" class="w-3.5 h-3.5"></i><span>Friends</span></a></nav></div></header>
<main class="max-w-5xl mx-auto px-4 py-7">
  <section id="friendsListPane"><div class="flex items-end justify-between gap-4 mb-6"><div><h1 class="font-mono font-bold text-2xl text-brand">Friends</h1><p class="text-sm text-ink/60 mt-1">Each card is one private bill between you and a friend. Its colour shows exactly who owes for that bill.</p></div><a href="/quick-split.html" class="bb-btn-primary !py-2 !px-3 text-[11px] shrink-0">+ Split with someone</a></div><div id="friendsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>
  <section id="friendDetailPane" class="hidden"><div class="flex items-center justify-between gap-3"><button id="backFriends" class="bb-btn-secondary !py-1.5 !px-3 text-[11px]">← All friends</button><button id="openAddBill" class="bb-btn-primary !py-1.5 !px-3 text-[11px]">+ Add bill</button></div><div class="mt-5 grid lg:grid-cols-[1fr_360px] gap-5"><div class="space-y-5"><div class="bb-card"><p class="text-[10px] font-mono uppercase tracking-widest text-ink/50">Shared balance with</p><h1 id="friendName" class="font-mono font-bold text-2xl text-brand mt-1"></h1><p id="friendBalance" class="font-mono font-bold text-xl mt-3"></p><p id="friendBalanceHelp" class="text-xs text-ink/60 mt-1"></p></div><div class="bb-card"><div class="flex flex-wrap items-center justify-between gap-3"><div class="flex gap-1 bg-ink/5 p-1 rounded-lg"><button id="currentBillsTab" type="button" class="bb-btn-secondary !py-1.5 !px-3 text-[10px]">This month</button><button id="historyBillsTab" type="button" class="bb-btn-secondary !py-1.5 !px-3 text-[10px]">History</button></div><select id="historyMonth" class="bb-input !w-auto !py-1.5 text-xs hidden"></select></div><p id="ledgerTitle" class="font-mono font-bold text-sm mt-4"></p><div id="friendLedger" class="mt-3 space-y-2"></div><div id="monthlySettlement" class="mt-4 pt-4 border-t border-ink/10"></div></div></div>
  <aside id="friendExpensePanel" class="bb-card h-fit"><h2 class="font-mono font-bold text-sm text-brand">Add another bill</h2><p class="text-xs text-ink/60 mt-1">Both people can add a new private bill from here.</p><form id="friendExpenseForm" class="space-y-3 mt-4"><input id="friendExpenseTitle" class="bb-input" placeholder="What was this for?" required><div class="grid grid-cols-2 gap-3"><input id="friendExpenseAmount" class="bb-input" type="number" min="0.01" step="0.01" placeholder="Amount" required><select id="friendExpenseCurrency" class="bb-input" data-currency-select></select></div><input id="friendExpenseDate" class="bb-input" type="date" required><div><label class="bb-label">Who paid this bill?</label><select id="friendPaidBy" class="bb-input"><option value="me">I paid</option><option value="friend">Friend paid</option></select></div><select id="friendExpenseType" class="bb-input"><option value="EQUAL">Split equally</option><option value="PERCENTAGE">Custom percentage</option><option value="EXACT">Custom amounts</option><option value="SHARES">Share ratio</option></select><div id="friendValues" class="hidden space-y-2"><label id="friendPayerValueLabel" class="bb-label">Your value</label><input id="friendPayerValue" class="bb-input" type="number" min="0" step="0.01"><label id="friendOtherValueLabel" class="bb-label">Friend's value</label><input id="friendOtherValue" class="bb-input" type="number" min="0" step="0.01"></div><p id="friendMsg" class="text-xs font-mono"></p><button class="bb-btn-primary w-full" type="submit">Add private bill</button></form></aside></div></section>
</main><script src="/api.js?v=20260918j"></script><script src="/friends.js?v=20260918l"></script></body></html>
