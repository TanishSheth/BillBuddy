<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>BillBuddy — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="bb-bg text-ink min-h-screen flex items-center justify-center px-5 py-12">

  <div class="auth-card w-full">
    <div class="flex items-center gap-3 mb-8 justify-center">
      <div class="stamp-mark">$</div>
      <div>
        <h1 class="font-mono font-bold text-lg tracking-tight leading-none">BillBuddy</h1>
        <p class="text-[11px] uppercase tracking-widest text-ink/50 leading-none mt-1">Reset Password</p>
      </div>
    </div>

    <div class="bb-card">
      <h2 class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-4">Choose a new password</h2>

      <form id="resetForm" class="space-y-4 font-mono text-sm">
        <div>
          <label class="bb-label">New password</label>
          <input id="password" type="password" class="bb-input" placeholder="••••••" required minlength="6" autocomplete="new-password" />
        </div>
        <div>
          <label class="bb-label">Confirm password</label>
          <input id="confirmPassword" type="password" class="bb-input" placeholder="••••••" required minlength="6" autocomplete="new-password" />
        </div>
        <p id="resetMsg" class="text-xs font-mono"></p>
        <button type="submit" class="bb-btn-primary w-full">Update password</button>
      </form>

      <p class="text-center mt-4">
        <a href="/login.html" class="auth-toggle">Back to sign in</a>
      </p>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      $("#resetForm").classList.add("hidden");
      const msg = $("#resetMsg");
      msg.textContent = "This reset link is invalid. Request a new one from the sign-in page.";
      msg.className = "text-xs font-mono balance-negative";
    }

    $("#resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("#resetMsg");
      msg.textContent = "";

      const password = $("#password").value;
      const confirmPassword = $("#confirmPassword").value;

      if (password !== confirmPassword) {
        msg.textContent = "Passwords do not match.";
        msg.className = "text-xs font-mono balance-negative";
        return;
      }

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          const detail = data.detail;
          const errMsg = typeof detail === "string" ? detail : "Request failed";
          throw new Error(errMsg);
        }

        msg.textContent = data.message || "Password updated.";
        msg.className = "text-xs font-mono balance-positive";
        $("#resetForm").classList.add("hidden");
        setTimeout(() => { window.location.href = "/login.html"; }, 1500);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "text-xs font-mono balance-negative";
      }
    });
  </script>
</body>
</html>
