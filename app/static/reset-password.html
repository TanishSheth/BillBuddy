<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>ShareSquad — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/styles.css?v=20260918g">
</head>
<body class="bb-bg text-ink min-h-screen flex items-center justify-center px-5 py-12">

  <div class="auth-card w-full">
    <div class="flex flex-col items-center gap-2 mb-8 text-center">
      <img src="/logo.png" alt="ShareSquad" class="h-16 w-auto object-contain drop-shadow-sm mb-1" onerror="this.style.display='none'">
      <div>
        <h1 class="font-mono font-bold text-xl tracking-tight leading-none text-brand">ShareSquad</h1>
        <p class="text-[11px] uppercase tracking-widest text-ink/50 leading-none mt-1">Set New Password</p>
      </div>
    </div>

    <div class="bb-card">
      <h2 class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-4">Choose a New Password</h2>
      <form id="resetForm" class="space-y-4 font-mono text-sm">
        <div>
          <label class="bb-label">New Password</label>
          <input id="password" type="password" class="bb-input" placeholder="••••••••" minlength="8" required autocomplete="new-password" />
          <p class="text-[10px] text-ink/55 mt-1.5 leading-snug">At least 8 characters, 1 uppercase letter, 2 numbers, and 1 special character (!@#$…).</p>
        </div>
        <div>
          <label class="bb-label">Confirm Password</label>
          <input id="confirmPassword" type="password" class="bb-input" placeholder="••••••••" minlength="8" required autocomplete="new-password" />
        </div>
        <p id="resetMsg" class="text-xs font-mono"></p>
        <button type="submit" class="bb-btn-primary w-full">Reset Password</button>
      </form>
      <p class="text-center mt-4">
        <a href="/login.html" class="auth-toggle">Back to sign in</a>
      </p>
    </div>
  </div>

  <script src="/api.js?v=20260918g"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const form = $("#resetForm");
    const msg = $("#resetMsg");

    if (!token) {
      msg.textContent = "Invalid password reset link. Please request a new one.";
      msg.className = "text-xs font-mono balance-negative";
      form.querySelector("button").disabled = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const password = $("#password").value;
      const confirm = $("#confirmPassword").value;

      if (password !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.className = "text-xs font-mono balance-negative";
        return;
      }
      const strong =
        password.trim().length >= 8 &&
        /[A-Z]/.test(password) &&
        (password.match(/\d/g) || []).length >= 2 &&
        /[^A-Za-z0-9]/.test(password);
      if (!strong) {
        msg.textContent = "Password must be at least 8 characters and include 1 uppercase letter, 2 numbers, and 1 special character.";
        msg.className = "text-xs font-mono balance-negative";
        return;
      }

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Reset failed");
        }
        msg.textContent = data.message || "Password reset successful! Redirecting to sign in…";
        msg.className = "text-xs font-mono balance-positive";
        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1500);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "text-xs font-mono balance-negative";
      }
    });
  </script>
</body>
</html>
