<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Friends · ShareSquad</title><link rel="stylesheet" href="/style.css"></head>
<body class="bb-bg text-ink min-h-screen"><main class="max-w-md mx-auto px-5 py-16"><section class="bb-card"><p class="font-mono text-xs text-brand">SHARESQUAD</p><h1 class="font-mono font-bold text-2xl mt-2">Become friends</h1><p id="message" class="text-sm text-ink/65 mt-3">Opening your friend invite…</p><a id="loginLink" href="/login.html" class="bb-btn-primary inline-flex mt-5 hidden">Log in or sign up</a></section></main>
<script src="/api.js"></script><script>
  const code = new URLSearchParams(location.search).get('code');
  const message = document.querySelector('#message');
  const loginLink = document.querySelector('#loginLink');
  async function accept() {
    try {
      await ShareSquad.api(`/friends/invites/${encodeURIComponent(code)}/accept`, { method: 'POST' });
      localStorage.removeItem('sharesquad_pending_friend_invite');
      message.textContent = 'You are now friends. Opening your Friends list…';
      setTimeout(() => { location.href = '/friends.html'; }, 650);
    } catch (error) { message.textContent = error.message || 'This friend invite could not be accepted.'; }
  }
  if (!code) { message.textContent = 'This friend invite link is incomplete.'; }
  else if (ShareSquad.getToken()) accept();
  else { localStorage.setItem('sharesquad_pending_friend_invite', code); message.textContent = 'Log in or create your account to accept this friend invite.'; loginLink.classList.remove('hidden'); }
</script></body></html>
