<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Join group · ShareSquad</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sharesquad_theme") || "system";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "theme-dark" : "theme-light");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=20261008cabinet" />
</head>
<body class="bb-bg text-ink min-h-screen flex items-center justify-center px-4">
  <div class="bb-card max-w-md w-full text-center p-6">
    <h1 class="font-mono font-bold text-xl text-brand mb-2">Join group</h1>
    <p id="statusMsg" class="font-mono text-sm text-ink/60 mb-4">Checking your invite…</p>
    <a id="signInLink" href="/login.html" class="bb-btn-primary hidden">Sign in to join</a>
  </div>

  <script src="/api.js?v=20261007scaleHardening"></script>
  <script>
    const PENDING_INVITE_KEY = "sharesquad_pending_invite";
    const code = new URLSearchParams(window.location.search).get("code");
    const msg = document.getElementById("statusMsg");
    const signInLink = document.getElementById("signInLink");

    if (!code) {
      msg.textContent = "No group link was found.";
    } else {
      localStorage.setItem(PENDING_INVITE_KEY, code);
      const token = ShareSquad.getToken();
      if (!token) {
        const next = `/join.html?code=${encodeURIComponent(code)}`;
        signInLink.href = `/login.html?next=${encodeURIComponent(next)}`;
        signInLink.classList.remove("hidden");
        msg.textContent = "Sign in or create an account to join this group automatically.";
      } else {
        fetch("/api/groups/join", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ invite_code: code }),
        })
          .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error(data.detail || "Could not join the group");
            localStorage.removeItem(PENDING_INVITE_KEY);
            ShareSquad.setStoredGroupId(data.id);
            msg.textContent = `Joined “${data.name}”. Opening the group…`;
            msg.className = "font-mono text-sm balance-positive mb-4";
            setTimeout(() => { window.location.href = `/group?group=${encodeURIComponent(data.id)}`; }, 700);
          })
          .catch((err) => {
            msg.textContent = err.message;
            msg.className = "font-mono text-sm balance-negative mb-4";
          });
      }
    }
  </script>
</body>
</html>
