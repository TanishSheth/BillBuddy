<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<script>(function(){try{var k="sharesquad_theme",p=localStorage.getItem(k)||"system",d=p==="dark"||(p!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("theme-dark",d);document.documentElement.classList.toggle("theme-light",!d);document.documentElement.dataset.theme=d?"dark":"light";var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d?"#0B1220":"#F8FAFC");}catch(e){}})();</script>
<script>
/* Block browser Back onto login while still signed in. Typing /login or Sign out still works. */
(function () {
  try {
    var token = localStorage.getItem("sharesquad_token") || localStorage.getItem("billbuddy_token");
    if (!token) return;
    var back = false;
    try {
      var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      if (nav && nav.type === "back_forward") back = true;
    } catch (e1) {}
    try {
      if (!back && performance.navigation && performance.navigation.type === 2) back = true;
    } catch (e2) {}
    if (!back) return;
    try {
      if (sessionStorage.getItem("sharesquad_allow_login") === "1") {
        sessionStorage.removeItem("sharesquad_allow_login");
        return;
      }
    } catch (e0) {}
    var next = new URLSearchParams(location.search).get("next");
    var dest = "/app";
    if (next && next.charAt(0) === "/" && next.indexOf("//") !== 0 && next !== "/" && next.indexOf("/landing") !== 0 && next.indexOf("/login") !== 0) dest = next;
    location.replace(dest);
  } catch (e) {}
})();
</script>
<title>ShareSquad — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/styles.css?v=20261027demoReset1">
</head>
<body class="bb-bg text-ink min-h-screen flex items-center justify-center px-5 py-12">

  <div class="auth-card w-full">
    <div class="flex flex-col items-center gap-2 mb-8 text-center">
      <img src="/logo.png" alt="ShareSquad" class="h-20 w-auto object-contain drop-shadow-sm mb-1" onerror="this.style.display='none'">
      <div>
        <h1 class="font-mono font-bold text-2xl tracking-tight leading-none text-brand">ShareSquad</h1>
        <p class="text-[11px] uppercase tracking-widest text-ink/50 leading-none mt-1">Smart Expense Splitter & Personal Tracker</p>
      </div>
    </div>

    <div class="bb-card shadow-sm">
      <h2 id="formTitle" class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-4">Sign In</h2>

      <form id="authForm" class="space-y-4 font-mono text-sm">
        <div id="nameField" class="hidden">
          <label class="bb-label">Display Name</label>
          <input id="displayName" class="bb-input" placeholder="Your name" />
        </div>
        <div>
          <label class="bb-label">Email</label>
          <input id="email" type="email" class="bb-input" placeholder="you@example.com" required />
        </div>
        <div id="passwordField">
          <div class="flex items-center justify-between gap-2">
            <label class="bb-label">Password</label>
            <button type="button" id="forgotPasswordBtn" class="auth-toggle text-[10px] normal-case tracking-normal">Forgot password?</button>
          </div>
          <input id="password" type="password" class="bb-input" placeholder="••••••••" autocomplete="current-password" />
          <p id="passwordHint" class="hidden text-[10px] text-ink/55 mt-1.5 leading-snug">At least 8 characters, 1 uppercase letter, 2 numbers, and 1 special character (!@#$…).</p>
        </div>
        <p id="authMsg" class="text-xs font-mono"></p>
        <button type="submit" id="submitBtn" class="bb-btn-primary w-full">Sign In</button>
      </form>

      <p id="toggleRow" class="text-center mt-4">
        <span id="toggleMode" class="auth-toggle">Create an account</span>
      </p>
      <p id="backToSignInRow" class="hidden text-center mt-4">
        <span id="backToSignIn" class="auth-toggle">Back to sign in</span>
      </p>
      <p id="restoreAccountRow" class="text-center mt-3">
        <span id="restoreAccountBtn" class="auth-toggle text-[10px] normal-case tracking-normal">Restore a deleted account</span>
      </p>
    </div>
  </div>

  <script src="/api.js?v=20261027demoReset1"></script>
  <script>
    const PENDING_INVITE_KEY = "sharesquad_pending_invite";
    const PENDING_QUICK_SPLIT_KEY = "sharesquad_pending_quick_split";
    const PENDING_QUICK_SPLIT_SLOT_KEY = "sharesquad_pending_quick_split_slot";
    // Keep redirect logic local so a partial/cached api.js cannot break Sign In.
    function safeAppRedirect(rawNext) {
      if (window.ShareSquad && typeof ShareSquad.safeAppRedirect === "function") {
        return ShareSquad.safeAppRedirect(rawNext);
      }
      const next = String(rawNext || "").trim();
      if (!next || next === "/" || next === "/landing.html" || next.startsWith("//") || !next.startsWith("/")) {
        return "/app";
      }
      const pathOnly = next.split("?")[0].replace(/\/+$/, "") || "/";
      if (pathOnly === "/login" || pathOnly === "/login.html") return "/app";
      return next;
    }

    let mode = "signin"; // signin | register | forgot | restore

    function setMode(next) {
      mode = next;
      const isRegister = mode === "register";
      const isForgot = mode === "forgot";
      const isRestore = mode === "restore";

      $("#formTitle").textContent = isRegister ? "Create Account" : isForgot ? "Reset Password" : isRestore ? "Restore Account" : "Sign In";
      $("#nameField").classList.toggle("hidden", !isRegister);
      $("#passwordField").classList.toggle("hidden", isForgot);
      $("#passwordHint").classList.toggle("hidden", !isRegister);
      if (isRegister) {
        $("#password").setAttribute("minlength", "8");
        $("#password").autocomplete = "new-password";
      } else {
        $("#password").removeAttribute("minlength");
        $("#password").autocomplete = "current-password";
      }
      $("#toggleRow").classList.toggle("hidden", isForgot || isRestore);
      $("#backToSignInRow").classList.toggle("hidden", !isForgot && !isRestore);
      $("#restoreAccountRow").classList.toggle("hidden", isForgot || isRestore);
      $("#submitBtn").textContent = isRegister ? "Create Account" : isForgot ? "Send reset link" : isRestore ? "Restore account" : "Sign In";
      $("#toggleMode").textContent = isRegister ? "Already have an account? Sign in" : "Create an account";
      $("#password").required = !isForgot;
      $("#authMsg").textContent = "";
    }

    function passwordLooksStrong(value) {
      const password = (value || "").trim();
      return (
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        (password.match(/\d/g) || []).length >= 2 &&
        /[^A-Za-z0-9]/.test(password)
      );
    }

    if (new URLSearchParams(window.location.search).get("recovery") === "1") {
      setMode("restore");
      $("#authMsg").textContent = "Use the same email and password to restore your account within 30 days.";
      $("#authMsg").className = "text-xs font-mono text-ink/60";
    } else if (new URLSearchParams(window.location.search).get("mode") === "signup") {
      setMode("register");
    } else {
      setMode("signin");
    }

    $("#toggleMode").addEventListener("click", () => {
      setMode(mode === "register" ? "signin" : "register");
    });

    $("#forgotPasswordBtn").addEventListener("click", () => setMode("forgot"));
    $("#backToSignIn").addEventListener("click", () => setMode("signin"));
    $("#restoreAccountBtn").addEventListener("click", () => setMode("restore"));

    $("#authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("#authMsg");
      msg.textContent = "";
      const email = $("#email").value.trim();

      if (mode === "forgot") {
        if (!email) {
          msg.textContent = "Enter your email address.";
          msg.className = "text-xs font-mono balance-negative";
          return;
        }

        try {
          const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.detail || res.statusText || "Request failed");
          }

          let successText = data.message || "Check your email for a reset link.";
          if (data.reset_url) {
            successText += ` Dev link: ${data.reset_url}`;
          }
          msg.textContent = successText;
          msg.className = "text-xs font-mono balance-positive";
        } catch (err) {
          msg.textContent = err.message;
          msg.className = "text-xs font-mono balance-negative";
        }
        return;
      }

      const password = $("#password").value;
      const displayName = $("#displayName").value.trim();
      const isRegister = mode === "register";
      const isRestore = mode === "restore";

      if (isRegister && !displayName) {
        msg.textContent = "Enter your display name.";
        msg.className = "text-xs font-mono balance-negative";
        return;
      }
      if (isRegister && !passwordLooksStrong(password)) {
        msg.textContent = "Password must be at least 8 characters and include 1 uppercase letter, 2 numbers, and 1 special character.";
        msg.className = "text-xs font-mono balance-negative";
        return;
      }

      const endpoint = isRegister ? "/api/auth/register" : isRestore ? "/api/auth/restore-account" : "/api/auth/login";
      const body = isRegister
        ? { email, password, display_name: displayName }
        : { email, password };

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = data.detail;
          const errMsg = typeof detail === "string" ? detail : Array.isArray(detail) ? detail.map((d) => d.msg).join(", ") : (res.statusText || "Request failed");
          throw new Error(errMsg);
        }

        ShareSquad.setToken(data.access_token);
        try { sessionStorage.removeItem("sharesquad_allow_login"); } catch (_) {}

        const params = new URLSearchParams(window.location.search);
        let redirect = safeAppRedirect(params.get("next"));
        const inviteCode = localStorage.getItem(PENDING_INVITE_KEY);
        if (inviteCode) {
          localStorage.removeItem(PENDING_INVITE_KEY);
          const joinRes = await fetch("/api/groups/join", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${data.access_token}` },
            body: JSON.stringify({ invite_code: inviteCode }),
          });
          if (joinRes.ok) {
            const group = await joinRes.json();
            ShareSquad.setStoredGroupId(group.id);
            redirect = "/group.html";
          }
        }

        const quickCode = localStorage.getItem(PENDING_QUICK_SPLIT_KEY);
        if (quickCode) {
          const quickSlot = localStorage.getItem(PENDING_QUICK_SPLIT_SLOT_KEY);
          localStorage.removeItem(PENDING_QUICK_SPLIT_KEY);
          localStorage.removeItem(PENDING_QUICK_SPLIT_SLOT_KEY);
          const quickRes = await fetch("/api/quick-splits/join", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${data.access_token}` },
            body: JSON.stringify({ invite_code: quickCode, participant_token: quickSlot }),
          });
          if (quickRes.ok) {
            const quickSplit = await quickRes.json();
            redirect = `/quick-split.html?id=${quickSplit.id}`;
          }
        }

        window.location.replace(redirect);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "text-xs font-mono balance-negative";
      }
    });
  </script>
</body>
</html>
