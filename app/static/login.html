<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>ShareSquad — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/styles.css?v=20260918f">
</head>
<body class="bb-bg text-ink min-h-screen flex items-center justify-center px-5 py-12">

  <div class="auth-card w-full">
    <div class="flex flex-col items-center gap-2 mb-8 text-center">
      <img src="/logo.png" alt="ShareSquad" class="h-20 w-auto object-contain drop-shadow-sm mb-1" onerror="this.style.display='none'">
      <div>
        <h1 class="font-mono font-bold text-2xl tracking-tight leading-none text-brand">ShareSquad</h1>
        <p class="text-[11px] uppercase tracking-widest text-ink/50 leading-none mt-1">Smart Expense Splitter & Personal Tracker</p>
      </div>
    </div>

    <div class="bb-card shadow-sm">
      <h2 id="formTitle" class="font-mono uppercase text-xs tracking-widest text-ink/50 mb-4">Sign In</h2>

      <form id="authForm" class="space-y-4 font-mono text-sm">
        <div id="nameField" class="hidden">
          <label class="bb-label">Display Name</label>
          <input id="displayName" class="bb-input" placeholder="Your name" />
        </div>
        <div>
          <label class="bb-label">Email</label>
          <input id="email" type="email" class="bb-input" placeholder="you@example.com" required />
        </div>
        <div id="passwordField">
          <div class="flex items-center justify-between gap-2">
            <label class="bb-label">Password</label>
            <button type="button" id="forgotPasswordBtn" class="auth-toggle text-[10px] normal-case tracking-normal">Forgot password?</button>
          </div>
          <input id="password" type="password" class="bb-input" placeholder="••••••" minlength="6" />
        </div>
        <p id="authMsg" class="text-xs font-mono"></p>
        <button type="submit" id="submitBtn" class="bb-btn-primary w-full">Sign In</button>
      </form>

      <p id="toggleRow" class="text-center mt-4">
        <span id="toggleMode" class="auth-toggle">Create an account</span>
      </p>
      <p id="backToSignInRow" class="hidden text-center mt-4">
        <span id="backToSignIn" class="auth-toggle">Back to sign in</span>
      </p>
    </div>
  </div>

  <script src="/api.js?v=20260918f"></script>
  <script>
    const PENDING_INVITE_KEY = "sharesquad_pending_invite";

    if (ShareSquad.getToken()) {
      window.location.href = "/";
    }

    let mode = "signin"; // signin | register | forgot

    function setMode(next) {
      mode = next;
      const isRegister = mode === "register";
      const isForgot = mode === "forgot";

      $("#formTitle").textContent = isRegister ? "Create Account" : isForgot ? "Reset Password" : "Sign In";
      $("#nameField").classList.toggle("hidden", !isRegister);
      $("#passwordField").classList.toggle("hidden", isForgot);
      $("#toggleRow").classList.toggle("hidden", isForgot);
      $("#backToSignInRow").classList.toggle("hidden", !isForgot);
      $("#submitBtn").textContent = isRegister ? "Create Account" : isForgot ? "Send reset link" : "Sign In";
      $("#toggleMode").textContent = isRegister ? "Already have an account? Sign in" : "Create an account";
      $("#password").required = !isForgot;
      $("#authMsg").textContent = "";
    }

    $("#toggleMode").addEventListener("click", () => {
      setMode(mode === "register" ? "signin" : "register");
    });

    $("#forgotPasswordBtn").addEventListener("click", () => setMode("forgot"));
    $("#backToSignIn").addEventListener("click", () => setMode("signin"));

    $("#authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("#authMsg");
      msg.textContent = "";
      const email = $("#email").value.trim();

      if (mode === "forgot") {
        if (!email) {
          msg.textContent = "Enter your email address.";
          msg.className = "text-xs font-mono balance-negative";
          return;
        }

        try {
          const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "Request failed");
          }

          let successText = data.message || "Check your email for a reset link.";
          if (data.reset_url) {
            successText += ` Dev link: ${data.reset_url}`;
          }
          msg.textContent = successText;
          msg.className = "text-xs font-mono balance-positive";
        } catch (err) {
          msg.textContent = err.message;
          msg.className = "text-xs font-mono balance-negative";
        }
        return;
      }

      const password = $("#password").value;
      const displayName = $("#displayName").value.trim();
      const isRegister = mode === "register";

      if (isRegister && !displayName) {
        msg.textContent = "Enter your display name.";
        msg.className = "text-xs font-mono balance-negative";
        return;
      }

      const endpoint = isRegister ? "/api/auth/register" : "/api/auth/login";
      const body = isRegister
        ? { email, password, display_name: displayName }
        : { email, password };

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          const detail = data.detail;
          const errMsg = typeof detail === "string" ? detail : Array.isArray(detail) ? detail.map((d) => d.msg).join(", ") : "Request failed";
          throw new Error(errMsg);
        }

        ShareSquad.setToken(data.access_token);

        let redirect = "/";
        const inviteCode = localStorage.getItem(PENDING_INVITE_KEY);
        if (inviteCode) {
          localStorage.removeItem(PENDING_INVITE_KEY);
          const joinRes = await fetch("/api/groups/join", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${data.access_token}`,
            },
            body: JSON.stringify({ invite_code: inviteCode }),
          });
          if (joinRes.ok) {
            const group = await joinRes.json();
            ShareSquad.setStoredGroupId(group.id);
            redirect = "/group.html";
          }
        }

        window.location.href = redirect;
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "text-xs font-mono balance-negative";
      }
    });
  </script>
</body>
</html>
