<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Minimal Windows Fontconfig for WeasyPrint (Tesseract's DLL has no bundled config). -->
<fontconfig>
  <dir>C:/Windows/Fonts</dir>
  <dir>~/AppData/Local/Microsoft/Windows/Fonts</dir>
  <cachedir>~/AppData/Local/fontconfig</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Segoe UI</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>Consolas</string></edit>
  </match>
</fontconfig>
